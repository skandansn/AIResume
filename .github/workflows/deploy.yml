name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # built first and kept local, so the tests run against the very image that
      # will be published rather than an approximation of it
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: airesume:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the tests inside it
        run: |
          docker run --rm -v "$PWD/tests:/tests:ro" --entrypoint sh airesume:ci -c \
            "pip install --quiet pytest && python -m pytest /tests -q -p no:cacheprovider"

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: skandans/airesume:latest
          cache-from: type=gha

      # an image push alone does not redeploy an image backed service, so the
      # deploy is asked for explicitly
      - name: Tell Render to pull it
        run: curl --fail --silent --show-error -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
